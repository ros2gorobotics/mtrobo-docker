services:
  mtrobo:
    image: ghcr.io/ros2gorobotics/mtrobo-docker:jazzy
    container_name: mtrobo

    # Docker Desktop (WSL2): ไม่ใช้ host network ให้ map port แทน
    ports:
      - "8888:8888/udp"   # micro-ROS agent (ESP32 -> PC)
      - "9999:9999/udp"   # UDP lidar
      - "9090:9090"       # rosbridge (หน้าเว็บ MTRobo)
      - "9092:9092"       # สถานะเครื่องหุ่นให้หน้าเว็บ: GET /status (อ่านอย่างเดียว)
    ipc: host

    environment:
      MTROBO_BASE: ${MTROBO_BASE:-2wd}
      MTROBO_LASER_SENSOR: ${MTROBO_LASER_SENSOR:-udp_lidar}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # RViz ผ่าน WSLg
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /tmp/runtime-ros
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"

    tmpfs:
      - /tmp/runtime-ros:uid=1000,gid=1000,mode=700

    volumes:
      - ./maps:/home/ros/maps          # แผนที่ / slam / zones / route graph
      - ./status:/opt/mtrobo-status:ro # endpoint สถานะ :9092/status (ไม่ใช้ docker.sock)
      - /mnt/wslg:/mnt/wslg
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix

    # bringup ตามเดิม + endpoint สถานะ (process แยก ยังตอบได้แม้ rosbridge ล่ม)
    command: ["bash", "/opt/mtrobo-status/start.sh"]

    restart: unless-stopped

  # กล้องมือถือบนหุ่น -> /camera/image/compressed (jpeg) + TF base_link -> camera_link
  # ตั้ง PHONE_CAMERA_URL ใน .env (ว่าง = ปิดกล้อง ระบบอื่นทำงานเหมือนเดิม) ดูหัวข้อ "กล้องมือถือ" ใน README
  # ใช้เครือข่ายเดียวกับ container mtrobo: ROS 2 เห็นกันเหมือนอยู่เครื่องเดียว และออกไปหามือถือใน LAN ได้
  camera:
    image: ghcr.io/ros2gorobotics/mtrobo-docker:jazzy
    container_name: mtrobo_camera
    network_mode: "service:mtrobo"
    depends_on:
      - mtrobo
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4     # ไม่ใช้ shared memory ข้าม container
      PHONE_CAMERA_URL: ${PHONE_CAMERA_URL:-}
      PHONE_CAMERA_MODE: ${PHONE_CAMERA_MODE:-snapshot}
      PHONE_CAMERA_RATE: ${PHONE_CAMERA_RATE:-5.0}
      CAM_X: ${CAM_X:-0.10}
      CAM_Z: ${CAM_Z:-0.35}
      CAM_PITCH: ${CAM_PITCH:-10}
    volumes:
      - ./camera:/camera:ro
    command: ["ros2", "launch", "/camera/phone_camera.launch.py"]
    restart: on-failure     # ไม่ตั้ง URL: container จบเองแล้วไม่เริ่มใหม่

  # หน้าเว็บ ros2ready (มือถือเปิด http://<IP เครื่อง Windows>:3000)
  # ต้อง clone ไว้ข้างไฟล์นี้ก่อน: git clone https://github.com/jamorn1976/ros2ready.git
  # อัปเดต: cd ros2ready && git pull && cd .. && docker compose up -d --build web
  web:
    build: ./ros2ready
    image: mtrobo-web:latest
    container_name: mtrobo_web
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ส่งแผนที่ที่บันทึกไว้ให้หน้าเว็บ (ปุ่มรูปตาในเมนู "นำทางด้วยแผนที่"): /mtrobo/map/read -> /mtrobo/map/result
  # อ่านโฟลเดอร์ maps อย่างเดียว ใช้เครือข่ายเดียวกับ container mtrobo
  mapread:
    image: ghcr.io/ros2gorobotics/mtrobo-docker:jazzy
    container_name: mtrobo_mapread
    network_mode: "service:mtrobo"
    depends_on:
      - mtrobo
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4     # ไม่ใช้ shared memory ข้าม container
      MAPS_DIR: /home/ros/maps
    volumes:
      - ./maps:/home/ros/maps:ro
      - ./mapread:/mapread:ro
    command: ["python3", "/mapread/map_reader.py"]
    restart: unless-stopped
