services:
  mtrobo:
    image: ghcr.io/ros2gorobotics/mtrobo-docker:jazzy
    container_name: mtrobo

    # Docker Desktop (WSL2): ไม่ใช้ host network ให้ map port แทน
    ports:
      - "8888:8888/udp"   # micro-ROS agent (ESP32 -> PC)
      - "9999:9999/udp"   # UDP lidar
      - "9090:9090"       # rosbridge (หน้าเว็บ MTRobo)
    ipc: host

    environment:
      MTROBO_BASE: ${MTROBO_BASE:-2wd}
      MTROBO_LASER_SENSOR: ${MTROBO_LASER_SENSOR:-udp_lidar}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # RViz ผ่าน WSLg
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /tmp/runtime-ros
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"

    tmpfs:
      - /tmp/runtime-ros:uid=1000,gid=1000,mode=700

    volumes:
      - ./maps:/home/ros/maps          # แผนที่ / slam / zones / route graph
      - /mnt/wslg:/mnt/wslg
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix

    restart: unless-stopped

  # หน้าเว็บ ros2ready (มือถือเปิด http://<IP เครื่อง Windows>:3000)
  # ต้อง clone ก่อน: git clone https://github.com/jamorn1976/ros2ready.git
  web:
    image: node:20
    container_name: mtrobo_web
    working_dir: /app
    volumes:
      - ./ros2ready:/app
      - web_modules:/app/node_modules   # เก็บใน Docker เพราะไดรฟ์ D: (/mnt/d) ช้ามากสำหรับ npm
      - web_next:/app/.next
    environment:
      NEXT_PUBLIC_DEFAULT_MODE: live
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm start -- -p 3000 -H 0.0.0.0"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  web_modules:
  web_next:
